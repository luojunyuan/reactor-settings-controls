[package]
name = "reactor-settings-controls"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "SettingsCard and SettingsExpander controls for windows-reactor"
readme = "README.md"
repository = "https://github.com/luojunyuan/reactor-settings-controls"
publish = false

[package.metadata.windows-rs]
repository = "https://github.com/microsoft/windows-rs.git"
revision = "d5b6a1f68f4fdd0c79495954d162901ea90da4f4"

[features]
default = []
test = ["windows-reactor/test"]

[dependencies]
# Keep the Reactor API pinned to one reproducible upstream windows-rs revision.
windows-reactor = { package = "windows-reactor", git = "https://github.com/microsoft/windows-rs.git", rev = "d5b6a1f68f4fdd0c79495954d162901ea90da4f4", version = "0.100.0" }
